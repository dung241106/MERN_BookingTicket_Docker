server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Together with the variable in proxy_pass below,
    # Nginx re-resolves "api" at request time, so it survives the api
    # container being restarted/recreated (new IP) without a 502 until reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compression for text assets
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Basic security headers (defined at server level only; do NOT add add_header
    # inside locations, because that would drop these inherited headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lightweight health endpoint for Docker healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Reverse proxy: browser calls /api/* on the same origin (:8080),
    # Nginx forwards to the Express container on the internal network.
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Vite output files are content-hashed => cache for a long time
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html must never be cached, otherwise users keep old hashed bundles
    location = /index.html {
        expires -1;
    }

    # SPA fallback: /movies, /my-bookings, /admin ... refresh must still serve the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
